[package]
name = "lattice-mining"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[[bin]]
name = "lattice-mining-coordinator"
path = "src/main.rs"
[dependencies]
lattice-primitives = {path="../lattice-rs/crates/lattice-primitives"}
lattice-cashew = {path="../cashew-rs"}
lattice-pow = {path="../lattice-rs/crates/lattice-pow"}
serde = {version="1",features=["derive"]}
serde_json = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
num-bigint = "0.4"
base64 = "0.22"
futures-util = "0.3"
tokio = {version="1",features=["rt-multi-thread","macros","time","process","io-util","fs","signal","sync","net"]}
tokio-util = {version="0.7",features=["rt"]}
reqwest = {version="0.12",default-features=false,features=["rustls-tls","stream","json"]}
url = "2"
clap = {version="4",features=["derive"]}
[target.'cfg(unix)'.dependencies]
nix = {version="0.30",features=["signal","process"]}
[dev-dependencies]
tempfile = "3"
